spring:
  application:
    name: prof.ia
  docker:
    compose:
      enabled: true
      file: compose.yml
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      username: root
      password: password
      authentication-database: admin
      database: profia

vaadin:
  url-mapping: /profia/*
  bun:
    enable: true

profia:
  ai:
    model: ${PROFIA_MODEL:tjake/Llama-3.2-1B-Instruct-JQ4}
    path: ${PROFIA_PATH:/etc/profia/models}